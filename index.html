<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Web Game & Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <!-- Menu Awal / Form Input -->
    <div id="start-screen" class="screen">
      <h1>Catching Stars 2D</h1>
      <p>Masukkan data Anda untuk memulai permainan:</p>
      <form id="player-form">
        <input type="text" id="username" placeholder="Username" required>
        <input type="tel" id="wa-number" placeholder="Nomor WhatsApp (misal: 0812345...)" required>
        <button type="submit" class="btn">Mulai Bermain</button>
      </form>
    </div>

    <!-- Layar Permainan -->
    <div id="game-screen" class="screen hidden">
      <div class="hud">
        <span>Skor: <strong id="score-display">0</strong></span>
        <span>Waktu: <strong id="timer-display">30</strong>s</span>
      </div>
      <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- Layar Game Over & Leaderboard -->
    <div id="end-screen" class="screen hidden">
      <h2>Permainan Selesai!</h2>
      <p>Skor Akhir Anda: <span id="final-score">0</span></p>
      
      <div class="leaderboard-box">
        <h3>Top 10 Leaderboard</h3>
        <ol id="leaderboard-list">
          <li>Memuat data...</li>
        </ol>
      </div>

      <button id="restart-btn" class="btn">Main Lagi</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
